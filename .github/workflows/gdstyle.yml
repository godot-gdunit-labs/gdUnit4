name: gdstyle

run-name: ${{ github.head_ref || github.ref_name }}-gdstyle

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: "ubuntu-22.04"
  workflow_dispatch:
    inputs:
      os:
        description: 'Defines the type of machine to run the job on.'
        required: false
        type: string
        default: "ubuntu-22.04"

env:
  GDSTYLE_VERSION: "0.5.0"

jobs:
  gdstyle:
    name: GdUnit
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout GdUnit Repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install gdstyle
        shell: bash
        run: cargo install gdstyle --version "${GDSTYLE_VERSION}" --locked

      - name: Run gdstyle check
        id: run-gdstyle-check
        shell: bash
        run: |
          mkdir -p reports/gdstyle/
          gdstyle --version
          gdstyle check --no-color --max-warnings 0 addons/gdUnit4/ 2>&1 | tee reports/gdstyle/gdstyle-check.txt

      - name: Run gdstyle fmt check
        id: run-gdstyle-fmt-check
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          mkdir -p reports/gdstyle/
          gdstyle fmt --check --no-color addons/gdUnit4/ 2>&1 | tee reports/gdstyle/gdstyle-fmt-check.txt

      - name: Upload gdstyle Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gdstyle-reports
          path: reports/gdstyle/**
          if-no-files-found: error
          compression-level: 0 # no compression
