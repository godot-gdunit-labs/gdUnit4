name: ci-dev

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
    paths-ignore:
      - '**.yml'
      - '**.jpg'
      - '**.png'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-dev-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        godot-version: ['4.7', '4.7.1']
        godot-status: ['stable']
        godot-net: ['.Net', '']

    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      statuses: write

    name: '@Godot_${{ matrix.godot-version }}-${{ matrix.godot-status }}${{ matrix.godot-net }}'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          lfs: true

      - shell: bash
        run: |
          # enable selftest on gdUnit4-action
          echo "GDUNIT_SELFTEST=true" >> "$GITHUB_ENV"

      - name: 'Run tests'
        if: ${{ matrix.godot-net == '' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          version: master
          paths: |
            res://addons/gdUnit4/test/
          # the e2e tests need rendered output, they are excluded here and run in the next step with a display
          arguments: '--verbose --headless -i res://addons/gdUnit4/test/e2e/'
          timeout: 5
          warnings-as-errors: true
          report-name: report_gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}

      # the e2e tests need rendered output, they run with a display after the headless tests
      - name: 'Run E2E tests'
        if: ${{ !cancelled() && matrix.godot-net == '' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          version: master
          paths: |
            res://addons/gdUnit4/test/e2e/
          timeout: 5
          warnings-as-errors: true
          report-name: report_gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}-e2e

      - name: 'Run .Net tests'
        if: ${{ matrix.godot-net == '.Net' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          godot-net: true
          dotnet-version: 'net9.0'
          version: master
          paths: |
            res://addons/gdUnit4/test/dotnet
          timeout: 5
          warnings-as-errors: true
          retries: 3 # We have set the number of repetitions to 3 because Godot mono randomly crashes during C# tests
          report-name: report_gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}-net
