name: ci-pr

run-name: ${{ github.head_ref || github.ref_name }}-ci-pr

on: # yamllint disable-line rule:truthy
  pull_request:
    paths-ignore:
      - '**.jpg'
      - '**.png'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: >-
    ci-pr-${{ github.event.pull_request.number || github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bot pull requests pass this gate only after a maintainer approves the current head commit.
  approval:
    if: >-
      ${{ github.event_name != 'pull_request_review'
          || github.event.pull_request.user.login == 'gdunit4-bot[bot]' }}
    runs-on: ubuntu-latest
    name: 'Approval'
    permissions:
      pull-requests: read
    steps:
      - name: 'Check for an approved review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: >-
            ${{ github.event.pull_request.number || github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "$PR_AUTHOR" != "gdunit4-bot[bot]" ]]; then
            echo "No approval gate is required for this pull request."
            exit 0
          fi

          reviews=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews")
          approved=$(jq --arg head "$PR_HEAD_SHA" --arg author "$PR_AUTHOR" \
            'add | group_by(.user.login) | map(max_by(.submitted_at))
             | any(.[]; .user.login != $author
               and .state == "APPROVED" and .commit_id == $head)' \
            <<< "$reviews")
          if [[ "$approved" != "true" ]]; then
            echo "::error::Approve this pull request commit before CI runs."
            exit 1
          fi
          echo "The current pull request commit has an approving review."

  unit-tests:
    needs: [approval]
    # runs when the approval succeeded or was skipped, because the pull request was not opened by the bot
    if: >-
      ${{ !cancelled() && needs.approval.result != 'failure'
          && (github.event_name != 'pull_request_review'
            || github.event.pull_request.user.login == 'gdunit4-bot[bot]') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # If changes are made here, they must be transferred to `.github\workflows\ci-pr-publish-report.yml`
        godot-version: ['4.7.2']
        godot-status: ['stable']
        godot-net: ['.Net', '']
        include:
          - godot-version: '4.8'
            godot-status: 'beta3'

    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      statuses: write

    name: '@Godot_${{ matrix.godot-version }}-${{ matrix.godot-status }}${{ matrix.godot-net }}'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          lfs: true

      - shell: bash
        run: |
          # enable selftest on gdUnit4-action
          echo "GDUNIT_SELFTEST=true" >> "$GITHUB_ENV"

      - name: 'Run tests'
        if: ${{ matrix.godot-net == '' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          version: installed
          paths: |
            res://addons/gdUnit4/test/
          # the e2e tests need rendered output, they are excluded here and run in the next step with a display
          arguments: '--verbose -i res://addons/gdUnit4/test/e2e/'
          headless: true
          timeout: 5
          warnings-as-errors: true
          publish-report: false
          report-name: gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}

      # the e2e tests need rendered output, they run with a display after the headless tests
      - name: 'Run E2E tests'
        if: ${{ !cancelled() && matrix.godot-net == '' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          version: installed
          paths: |
            res://addons/gdUnit4/test/e2e/
          timeout: 5
          warnings-as-errors: true
          publish-report: false
          report-name: gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}-e2e

      - name: 'Run .Net tests'
        if: ${{ matrix.godot-net == '.Net' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          godot-net: true
          dotnet-version: 'net9.0'
          version: installed
          paths: |
            res://addons/gdUnit4/test/dotnet
          timeout: 5
          warnings-as-errors: true
          retries: 3 # We have set the number of repetitions to 3 because Godot mono randomly crashes during C# tests
          publish-report: false
          report-name: gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}-net

  finalize:
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'pull_request_review'
            || github.event.pull_request.user.login == 'gdunit4-bot[bot]') }}
    runs-on: ubuntu-latest
    name: 'Final Results'
    needs: [approval, unit-tests]
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
