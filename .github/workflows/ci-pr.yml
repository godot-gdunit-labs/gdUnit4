name: ci-pr

run-name: ${{ github.head_ref || github.ref_name }}-ci-pr

on: # yamllint disable-line rule:truthy
  pull_request:
    paths-ignore:
      - '**.jpg'
      - '**.png'
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.event.number }}
  cancel-in-progress: true


jobs:
  format-checks:
    if: ${{ !cancelled() }}
    name: '📝 Linting & Formatting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/formatting_checks

  gdstyle:
    if: ${{ !cancelled() }}
    name: '📝 gdstyle check'
    uses: ./.github/workflows/gdstyle.yml


  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # If changes are made here, they must be transferred to `.github\workflows\ci-pr-publish-report.yml`
        godot-version: ['4.7', '4.7.1']
        godot-status: ['stable']
        godot-net: ['.Net', '']
        include:
          - godot-version: '4.8'
            godot-status: 'dev7'

    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      statuses: write

    name: GdUnit4 | Godot_${{ matrix.godot-version }}-${{ matrix.godot-status }}${{ matrix.godot-net }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          lfs: true

      - shell: bash
        run: |
          # enable selftest on gdUnit4-action
          echo "GDUNIT_SELFTEST=true" >> "$GITHUB_ENV"

      - name: 'Test GdUnit4 dev - Godot_${{ matrix.godot-version }}-${{ matrix.godot-status }}'
        if: ${{ matrix.godot-net == '' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          version: installed
          paths: |
            res://addons/gdUnit4/test/
          # the e2e tests need rendered output, they are excluded here and run in the `e2e-tests` job with a display
          arguments: '--verbose --headless -i res://addons/gdUnit4/test/e2e/'
          timeout: 10
          warnings-as-errors: true
          publish-report: false
          report-name: gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}

      - name: 'Test GdUnit4 dev - Godot_${{ matrix.godot-version }}-${{ matrix.godot-status }}-net'
        if: ${{ matrix.godot-net == '.Net' }}
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.godot-version }}
          godot-status: ${{ matrix.godot-status }}
          godot-net: true
          dotnet-version: 'net9.0'
          version: installed
          paths: |
            res://addons/gdUnit4/test/dotnet
          timeout: 5
          warnings-as-errors: true
          retries: 3 # We have set the number of repetitions to 3 because Godot mono randomly crashes during C# tests
          publish-report: false
          report-name: gdUnit4_Godot${{ matrix.godot-version }}-${{ matrix.godot-status }}-net

  # end-to-end tests need rendered output, they run in their own job with a display
  e2e-tests:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      statuses: write

    name: GdUnit4 e2e | Godot_4.7-stable

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: 'Test GdUnit4 dev e2e - Godot_4.7-stable'
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7'
          version: installed
          paths: |
            res://addons/gdUnit4/test/e2e/
          timeout: 5
          warnings-as-errors: true
          publish-report: false
          report-name: gdUnit4_Godot4.7-stable-e2e

  finalize:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: 'Final Results'
    needs: [format-checks, gdstyle, unit-tests, e2e-tests]
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
