name: 'Publish Test Report'

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ['ci-pr']  # runs after ci-pr workflow
    types:
      - completed
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'ID of the workflow run to download artifacts from.'
        required: true
        default: ''

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  find-reports:
    name: 'Find Test Reports'
    runs-on: ubuntu-latest
    outputs:
      reports: ${{ steps.find.outputs.reports }}
    steps:
      - name: 'Collect the test reports of the run'
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}
        run: |
          reports=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired | not) | .name
              | select(test("^artifact_gdUnit4_Godot[0-9][0-9.]*-[a-z0-9]+(-e2e|-net)?$")) | ltrimstr("artifact_")' \
            | jq --raw-input --null-input --compact-output '[inputs | select(length > 0)] | unique')
          echo "Found reports: $reports"
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

  publish-reports:
    needs: find-reports
    if: ${{ needs.find-reports.outputs.reports != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        report: ${{ fromJSON(needs.find-reports.outputs.reports) }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: 'Download artifacts'
        uses: actions/download-artifact@v8
        with:
          name: artifact_${{ matrix.report }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.workflow_run_id || github.event.workflow_run.id }}

      - name: 'Publish Test Results'
        uses: dorny/test-reporter@v3
        with:
          # using artifact to download is broken since download-artifact@v4 see https://github.com/dorny/test-reporter/issues/363
          # We do the download manually on step `Download artifacts`
          name: report_${{ matrix.report }}
          path: './home/runner/work/gdUnit4/gdUnit4/reports/**/*.xml'
          reporter: ${{ endsWith(matrix.report, '-net') && 'dotnet-trx' || 'java-junit' }}
          fail-on-error: 'false'
          fail-on-empty: 'false'
          use-actions-summary: 'false'
